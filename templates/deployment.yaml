---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-deploy
  labels:
    myversion: "1"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: clinic-front
  template:
    metadata:
      labels:
        app: clinic-front
    spec: # specification du pod
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: springboot
          image: ghcr.io/happydwarf/spring-petclinic:{{ .Values.image.tag }}
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH # On force le contexte de l'application à tp6
              value: {{ .Values.contextPath }}
          startupProbe:
            httpGet:
              path: {{ .Values.contextPath  }}/actuator/health/readiness
              port: {{ .Values.service.port  }}
            timeoutSeconds: 2
            periodSeconds: 10
            initialDelaySeconds: 10
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: {{ .Values.contextPath  }}/actuator/health/liveness
              port: {{ .Values.service.port  }}
            timeoutSeconds: 2
            periodSeconds: 10
            initialDelaySeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: {{ .Values.contextPath  }}/actuator/health/readiness
              port: {{ .Values.service.port  }}
            timeoutSeconds: 2
            periodSeconds: 10
            initialDelaySeconds: 20
            failureThreshold: 6